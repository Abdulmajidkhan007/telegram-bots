server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # React Router — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html keshlanmasin: aks holda brauzer yangi deploy'dan keyin ham
        # eski sahifani (eski JS fayl nomlari bilan) ko'rsatadi va faqat
        # qayta yangilaganda yangisi chiqadi. JS/CSS nomida hash bor —
        # ular pastda uzoq keshlanadi.
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
