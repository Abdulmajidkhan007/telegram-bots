# Railway'da: Settings → Root Directory = /bots/ovoz-bot,
# Config-as-code fayl yo'li = /bots/ovoz-bot/railway.toml (Root Directory'ga ergashmaydi).
[build]
builder = "DOCKERFILE"
watchPatterns = ["/bots/ovoz-bot/**"]

[deploy]
restartPolicyType = "ALWAYS"
# Bitta token — bitta jarayon: ikkita nusxa getUpdates'da bir-birini uradi (409 Conflict).
numReplicas = 1
