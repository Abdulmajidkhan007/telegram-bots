version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: expense_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expensedb}
      POSTGRES_USER: ${POSTGRES_USER:-expenseuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expensepass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenseuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: expense_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: expense_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-expenseuser}:${POSTGRES_PASSWORD:-expensepass}@postgres:5432/${POSTGRES_DB:-expensedb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
      - BOT_TOKEN=${BOT_TOKEN}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - export_files:/app/exports

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: expense_bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-expenseuser}:${POSTGRES_PASSWORD:-expensepass}@postgres:5432/${POSTGRES_DB:-expensedb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      - API_URL=http://api:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./bot:/app

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: expense_dashboard
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  export_files:
